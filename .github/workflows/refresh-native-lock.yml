name: Refresh native build dependencies

concurrency:
  group: refresh-native-lock-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - maintenance/reliability-hardening
    paths:
      - "package.json"
      - ".github/workflows/refresh-native-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve and patch semver-compatible dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || echo "Some advisories may require a deliberate major upgrade; no force downgrade is applied."

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
          else
            git add package-lock.json
            git commit -m "chore: refresh lockfile for native packaging"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
