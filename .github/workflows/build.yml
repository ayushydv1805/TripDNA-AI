name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8")); console.log("Audit totals:", JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log([item.severity.toUpperCase(), name, "installed=" + (item.range || "unknown"), "fix=" + JSON.stringify(item.fixAvailable)].join(" | "));'

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
